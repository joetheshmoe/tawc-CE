name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build-tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu

      - name: Install Rust targets via rustup (fallback)
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android || true
          rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu || true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked || true

      - name: Install bindgen-cli
        run: cargo install bindgen-cli --locked || true

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make pkg-config curl \
            libarchive-tools file ninja-build bison autoconf automake libtool \
            libtool-bin libltdl-dev perl python3 python3-libxml2 xsltproc libexpat1-dev \
            libwayland-dev libwayland-bin libwayland-egl-backend-dev wayland-protocols \
            libvulkan-dev patchelf libx11-dev libx11-xcb-dev libxcb1-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-arm64-cross linux-libc-dev-arm64-cross \
            python3-mako python3-yaml python3-packaging
          # Ubuntu 24.04 apt meson is 1.3.2, but mesa requires >=1.4.0
          pip install --upgrade --break-system-packages meson mako pyyaml packaging

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/bindgen
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache sysroots
        uses: actions/cache@v4
        with:
          path: build/sysroots
          key: sysroots-${{ runner.os }}-${{ hashFiles('scripts/build-host-sysroot.sh') }}
          restore-keys: sysroots-${{ runner.os }}-

      - name: Build debug APK
        run: scripts/build-app.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tawc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check no dev code in release (debug must still pass)
        run: scripts/check-no-dev-code.sh || true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --continue
