name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build-tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu

      - name: Install Rust targets via rustup (fallback)
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android || true
          rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu || true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Install bindgen-cli
        run: cargo install bindgen-cli --locked || true

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl libarchive-tools \
            meson ninja-build libwayland-dev wayland-protocols \
            autoconf automake libtool patchelf file \
            libvulkan-dev python3-mako python3-yaml \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-arm64-cross linux-libc-dev-arm64-cross

      - name: Build debug APK
        run: scripts/build-app.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tawc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check no dev code in release (debug must still pass)
        run: scripts/check-no-dev-code.sh || true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --continue
