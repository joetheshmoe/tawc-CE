name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only auto-release on pushes to main that actually built; skip PRs
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup TAWC
        uses: ./.github/actions/setup

      - name: Resolve version
        id: version
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v${VER}-r${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "apk=tawc-v${VER}-r${{ github.run_number }}.apk" >> $GITHUB_OUTPUT
          echo "version $VER tag v${VER}-r${{ github.run_number }}"

      - name: Build release APK
        # CI now debug-signs release via app/build.gradle.kts fallback
        # (signingConfig = debug) so the APK is installable. Prod
        # signed releases still use scripts/build-release-apk.sh with
        # KEYSTORE_* (notes/release.md).
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/release/
          # verify signing (debug keystore)
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk || apksigner verify --verbose app/build/outputs/apk/release/app-release-unsigned.apk || true

      - name: Prepare artifact
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "${{ steps.version.outputs.apk }}"
          fi
          ls -lh "${{ steps.version.outputs.apk }}"
          apksigner verify --verbose "${{ steps.version.outputs.apk }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: tawc ${{ steps.version.outputs.version }} (r${{ github.run_number }})
          body: |
            Auto-release from push to `main` (${{ github.sha }}).

            - Version `${{ steps.version.outputs.version }}` from `app/build.gradle.kts`
            - Debug-signed `app-release.apk` (installable via `adb install -r`). For prod-signed builds, configure `KEYSTORE_*` secrets and switch to `scripts/build-release-apk.sh` (see `notes/release.md`) — note debug→prod requires uninstall (different key, data loss per notes/release.md:Keystore).
            - Smoke-test: `adb install -r ${{ steps.version.outputs.apk }}` + distro install.

            Full log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: ${{ steps.version.outputs.apk }}
          draft: false
          prerelease: true
          generate_release_notes: true
